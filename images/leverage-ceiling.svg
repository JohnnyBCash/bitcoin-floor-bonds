<text x="488" y="411" font-size="12" fill="#5F5E5A">Recommended</text>

<text x="80" y="434" font-size="11" fill="#888780">100x leverage is the structural endpoint (year 10+). Not a day-one capability. Practical limit: 10-20x for institutions.</text>

