<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/></marker></defs>

<rect x="220" y="30" width="240" height="50" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Emergency triggered</text>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">Collateral &lt; 100% face value</text>

<line x1="340" y1="80" x2="340" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<rect x="190" y="110" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">1. Sell all BTC at CME reference rate</text>

<line x1="340" y1="154" x2="340" y2="184" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<rect x="190" y="184" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">2. Pay senior first</text>
<text x="340" y="222" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">100% principal + accrued interest</text>

<line x1="340" y1="240" x2="340" y2="270" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<rect x="190" y="270" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">3. Pay junior from remainder</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">If sufficient: principal + accrued</text>

<line x1="340" y1="326" x2="340" y2="356" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<rect x="190" y="356" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">4. Residual to issuer</text>

<line x1="340" y1="400" x2="340" y2="430" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<rect x="140" y="430" width="400" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="450" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">5. If insufficient for senior</text>
<text x="340" y="468" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">Pro-rata to senior. Junior receives nothing.</text>

<rect x="40" y="510" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="530" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">No human discretion at any step</text>
<text x="340" y="548" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Every action specified in the indenture. Price is a published market rate.</text>

<text x="60" y="210" text-anchor="end" font-size="12" fill="#085041">First priority</text>
<line x1="62" y1="210" x2="188" y2="210" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>

<text x="60" y="296" text-anchor="end" font-size="12" fill="#633806">Second priority</text>
<line x1="62" y1="296" x2="188" y2="296" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>

<text x="620" y="456" text-anchor="start" font-size="12" fill="#791F1F">Last resort</text>
<line x1="540" y1="456" x2="618" y2="456" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>

</svg>
